services:
  mysql:
    image: mysql:8.0
    container_name: adminflow-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root123456}
      MYSQL_DATABASE: adminflow
      TZ: Asia/Shanghai
    ports: ["3306:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost","-proot123456"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    container_name: adminflow-redis
    ports: ["6379:6379"]
  server:
    build: ./adminflow-server
    container_name: adminflow-server
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: adminflow
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-root123456}
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-AdminFlow-Local-Dev-Secret-Key-Please-Replace-At-Least-32-Bytes}
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_started}
  ui:
    build: ./adminflow-ui
    container_name: adminflow-ui
    ports: ["80:80"]
    depends_on: [server]
volumes:
  mysql_data:
